name: Deploy website

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: markdown
          persist-credentials: false

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.77.0"

      - name: Build site
        run: hugo --minify
        working-directory: website

      - name: Check out johnwesthoff.com
        uses: actions/checkout@v4
        with:
          repository: JohnathonNow/johnwesthoff.com
          ref: main
          path: target
          token: ${{ secrets.JOHNWESTHOFF_DEPLOY_TOKEN }}

      - name: Copy generated site
        run: rsync -av --delete --exclude='.git/' --exclude='CNAME' website/public/ target/

      - name: Commit and push
        run: |
          git -C target config user.name "github-actions[bot]"
          git -C target config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C target add --all

          if git -C target diff --cached --quiet; then
            echo "No generated site changes to deploy."
          else
            git -C target commit -m "Deploy site from ${GITHUB_SHA}"
            git -C target push origin HEAD:main
          fi
